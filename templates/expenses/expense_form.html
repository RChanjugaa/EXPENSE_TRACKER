{% extends "base.html" %}
{% block title %}Add Expense{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="board-card p-4">
            <h1 class="h4 mb-3">Add Expense to {{ group.name }}</h1>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button class="btn btn-primary" type="submit">Save Expense</button>
                <a class="btn btn-outline-secondary" href="{% url 'group_detail' group.pk %}">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
