{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="board-card p-4">
            <h1 class="h4 mb-3">{{ title }}</h1>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button class="btn btn-primary" type="submit">Save</button>
                <a class="btn btn-outline-secondary" href="{% url 'group_list' %}">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
