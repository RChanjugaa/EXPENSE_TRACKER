{% extends "base.html" %}
{% block title %}Add Member{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="board-card p-4">
            <h1 class="h4">Add Member to {{ group.name }}</h1>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button class="btn btn-primary" type="submit">Add Member</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
