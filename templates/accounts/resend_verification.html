{% extends "base.html" %}
{% block title %}Resend Verification{% endblock %}
{% block content %}
<div class="row justify-content-center auth-wrap">
    <div class="col-lg-6">
        <div class="board-card p-4">
            <h1 class="h4">Resend verification code</h1>
            <p class="soft-text">Enter the email address you used to register. We will send a fresh 6-digit code.</p>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button class="btn btn-primary" type="submit">Send Verification</button>
                <a class="btn btn-outline-secondary" href="{% url 'login' %}">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
