{% extends "base.html" %}
{% block title %}Upload Proof{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="board-card p-4">
            <h1 class="h4">Upload Payment Proof</h1>
            <p class="soft-text">{{ payment.expense.title }} - {{ payment.amount }} to {{ payment.receiver.username }}</p>
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form.as_p }}
                <button class="btn btn-primary" type="submit">Mark Paid</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
